<    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Core System</title>
    <style>
        :root {
            --bg-color: #0b0d0e;
            --surface-color: #161a1d;
            --user-bubble: #004d40;
            --ai-bubble: #23272a;
            --text-main: #e3e6e8;
            --accent: #33b5e5;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .app-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: var(--surface-color);
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .header {
            padding: 20px;
            background: #1f2428;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: var(--accent);
        }
        .chat-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.4;
            animation: slideUp 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user {
            background-color: var(--user-bubble);
            color: #a7f3d0;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .ai {
            background-color: var(--ai-bubble);
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .input-area {
            padding: 15px;
            background: #1f2428;
            display: flex;
            gap: 10px;
        }
        /* Mobile Keyboard Open Friendly Input Box */
        input {
            flex: 1;
            padding: 14px;
            background: #2c3136;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            color: white;
            outline: none;
            font-size: 16px; /* 16px blocks auto-zoom on mobile safari/chrome */
            -webkit-appearance: none;
        }
        input:focus {
            border-color: var(--accent);
            background: #343a40;
        }
        button {
            background: var(--accent);
            color: #00364d;
            border: none;
            padding: 0 20px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">🤖 AI CORE SYSTEM</div>
        <div class="chat-area" id="chatBox">
            <div class="bubble ai">Hello! System online. Main aapka personal AI Assistant hoon. Ab check kijiye, keyboard mast khulega! 😉</div>
        </div>
        <div class="input-area">
            <!-- Normal Text input without restriction -->
            <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');

        function sendMessage() {
            let text = userInput.value.trim();
            if (!text) return;

            let userDiv = document.createElement('div');
            userDiv.className = 'bubble user';
            userDiv.innerText = text;
            chatBox.appendChild(userDiv);
            userInput.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Instantly refocus input after click to keep keyboard up
            userInput.focus();

            setTimeout(() => {
                let aiDiv = document.createElement('div');
                aiDiv.className = 'bubble ai';
                
                let reply = "Mera AI system abhi seekh raha hai. Aapne kaha: '" + text + "'";
                if(text.toLowerCase().includes('hello') || text.toLowerCase().includes('hi')) {
                    reply = "Hey there Ansh! Kahiye, ab toh keyboard mast chal raha hai na? 😎🚀";
                } else if(text.toLowerCase().includes('kaise ho')) {
                    reply = "Main ek dum makhhan chal rahi hoon! Aap batao!";
                } else if(text.toLowerCase().includes('naam')) {
                    reply = "Mera naam AI Core System hai!";
                }
                
                aiDiv.innerText = reply;
                chatBox.appendChild(aiDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 800);
        }

        userInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
    </script>
</body>
</html>
